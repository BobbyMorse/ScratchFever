[phases.setup]
aptPkgs = [
  "libglib2.0-0", "libnss3", "libnspr4", "libatk1.0-0", "libatk-bridge2.0-0",
  "libcups2", "libdrm2", "libdbus-1-3", "libxkbcommon0", "libatspi2.0-0",
  "libx11-6", "libxcomposite1", "libxdamage1", "libxext6", "libxfixes3",
  "libxrandr2", "libgbm1", "libpango-1.0-0", "libcairo2", "libasound2"
]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "rm -rf /app/.playwright",
  "PLAYWRIGHT_BROWSERS_PATH=/app/.playwright python -m playwright install --force chromium chromium-headless-shell",
  "ls -la /app/.playwright/",
  "test -f /app/.playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell && echo HEADLESS_SHELL_OK || (echo HEADLESS_SHELL_MISSING && exit 1)"
]

[variables]
PLAYWRIGHT_BROWSERS_PATH = "/app/.playwright"
