[project]
name = "scratchfever"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "aiosqlite>=0.20.0",
    "apscheduler>=3.10.4,<4.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "twilio>=9.0.0",
    "anthropic>=0.49.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.vercel]
entrypoint = "app.py"
